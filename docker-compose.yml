version: "3.8"

services:
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=sgraph
      - POSTGRES_PASSWORD=sgraph
      - POSTGRES_DB=sgraph
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgraph"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local stand-in for Amazon Neptune: Neo4j speaks openCypher natively, and
  # neptune-emulator/ wraps it in Neptune's HTTP contract. Dev only — see
  # `make dev-neptune`.
  neo4j:
    image: neo4j:5-community
    environment:
      - NEO4J_AUTH=neo4j/graphlagoon
      - NEO4J_server_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
    ports:
      - "7687:7687"
      - "7474:7474"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p graphlagoon 'RETURN 1' || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  postgres_data:
  neo4j_data:
